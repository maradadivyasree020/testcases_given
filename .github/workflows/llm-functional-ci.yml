name: LLM Functional CI

on:
  push:
    branches: [ "main", "master" ]    # change if your default branch is different
  pull_request:
    branches: [ "main", "master" ]

jobs:
  llm-functional-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 1) Generate JUnit tests from JSON via LLM (Java main)
      - name: Generate JUnit tests from JSON using LLM
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mvn -q -DskipTests exec:java \
            -Dexec.mainClass="com.example.tools.GenerateTestsFromJson"

      # 2) Run all tests (including generated ones)
      - name: Run Maven tests
        run: mvn -B clean test

      # 3) Summarize results as: TC_ID: DESC: ACC/REJ + TOTAL TC
      - name: Summarize functional test results
        run: |
          mvn -q -DskipTests exec:java \
            -Dexec.mainClass="com.example.tools.SummarizeResults"
