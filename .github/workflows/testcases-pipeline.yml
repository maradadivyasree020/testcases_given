name: Testcase Execution Pipeline

on:
  push:

jobs:
  testcase-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Detect backend code changes
        id: diff
        run: |
          git diff --name-only HEAD~1 HEAD > changes.txt || true
          if grep -E "src/main/java/com/example/college/(controller|service|repository)" changes.txt; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate test cases
        if: steps.diff.outputs.changed == 'true'
        run: mvn -q -DskipTests exec:java

      - name: Execute test cases and generate PDF
        run: mvn test -Dtest=JsonDrivenTestRunnerTest

      - name: Upload Test Execution Report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pdf
          path: test-cases/results.pdf
